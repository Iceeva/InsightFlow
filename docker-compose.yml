version: '3.9'

services:
  app:
    build: .
    ports:
      - '3000:3000'
      - '3001:3001'
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: insightflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  worker:
    build: .
    command: npm run worker
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
